<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weight Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Weight Log</title>
<style>
:root{
  --bg:#f5f7f7; --card:#fff; --text:#16221f; --muted:#6a7873; --line:#e1e8e6;
  --accent:#0f766e; --accent-text:#fff; --good:#15803d; --bad:#b91c1c; --input:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1514; --card:#18211f; --text:#e8f0ee; --muted:#8fa19c; --line:#2a3633;
    --accent:#2dd4bf; --accent-text:#07201c; --good:#4ade80; --bad:#f87171; --input:#101816; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
h1{font-size:1.4rem;margin:20px 0 4px}
h2{font-size:1.05rem;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
label.full{grid-column:1/-1}
input{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 14px}
button.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:10px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.75rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;white-space:nowrap}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:.8rem}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.x{padding:2px 8px;border:none;color:var(--muted);font-size:1.1rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
svg{width:100%;height:auto;display:block}
.empty{color:var(--muted);text-align:center;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:6px 12px;font-size:.85rem}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Weight Log</h1>
  <p class="sub">Daily weight &amp; waist &middot; weekly averages (weeks run Sunday&ndash;Saturday)</p>

  <section class="card">
    <h2>Add / update an entry</h2>
    <form id="form">
      <label class="full">Date<input type="date" id="date" required></label>
      <label>Weight (kg)<input type="number" id="weight" step="0.1" min="20" max="400" inputmode="decimal" required placeholder="e.g. 82.4"></label>
      <label>Waist (cm), optional<input type="number" id="waist" step="0.1" min="30" max="300" inputmode="decimal" placeholder="e.g. 94"></label>
      <button class="primary" type="submit">Save</button>
    </form>
  </section>

  <section class="card">
    <h2>Overview</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <div class="tabs" id="tabs">
      <button data-m="w" class="on">Weight</button>
      <button data-m="c">Waist</button>
    </div>
    <div id="chart"></div>
  </section>

  <section class="card">
    <h2>Weekly summary</h2>
    <div class="scroll" id="weeks"></div>
  </section>

  <section class="card">
    <h2>Daily log</h2>
    <div class="scroll" id="days"></div>
  </section>

  <section class="card">
    <h2>Backup &amp; move between devices</h2>
    <p class="sub">Your data is stored on this device only. Export a backup and import it on your other device.</p>
    <div class="row">
      <button id="exportJson">Export backup (.json)</button>
      <button id="exportCsv">Export CSV</button>
      <button id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var KEY = 'weightlog.v1';
  var mode = 'w';

  function load(){
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.entries) return d; } catch(e){}
    return { entries: {} };
  }
  var data = load();
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ alert('Could not save to this browser (storage blocked or full).'); }
  }

  // ---- date helpers (all local time) ----
  function pad(n){ return (n<10?'0':'')+n; }
  function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function weekStart(s){ var d=parse(s); d.setDate(d.getDate()-d.getDay()); return fmt(d); }
  function weekEnd(ws){ var d=parse(ws); d.setDate(d.getDate()+6); return fmt(d); }
  function nice(s){ return parse(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
  function niceFull(s){ return parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
  function r1(x){ return Math.round(x*10)/10; }
  function avg(a){ return a.reduce(function(s,x){return s+x;},0)/a.length; }

  // ---- data ----
  function sortedDays(){
    return Object.keys(data.entries).sort().map(function(k){ var e=data.entries[k]; return {date:k,w:e.w,c:e.c}; });
  }
  function weeks(){
    var map = {}, out = [];
    sortedDays().forEach(function(d){
      var ws = weekStart(d.date);
      (map[ws] = map[ws] || {start:ws, w:[], c:[]});
      map[ws].w.push(d.w);
      if (d.c != null) map[ws].c.push(d.c);
    });
    Object.keys(map).sort().forEach(function(k){
      var m = map[k];
      out.push({ start:k, end:weekEnd(k), n:m.w.length, w:avg(m.w), c:m.c.length?avg(m.c):null });
    });
    for (var i=0;i<out.length;i++){
      var p = out[i-1], cur = out[i];
      if (p){
        cur.dw = cur.w - p.w;
        cur.pct = (p.w - cur.w) / p.w * 100; // positive = lost
        cur.dc = (cur.c!=null && p.c!=null) ? cur.c - p.c : null;
      }
    }
    return out;
  }

  // ---- render ----
  function cls(v){ return v<0 ? 'good' : v>0 ? 'bad' : 'muted'; }
  function sign(v,u){ return (v>0?'+':'')+r1(v)+(u||''); }

  function renderStats(days, wk){
    var el = document.getElementById('stats');
    if (!days.length){ el.innerHTML = '<div class="empty" style="grid-column:1/-1">No entries yet.</div>'; return; }
    var first = days[0], last = days[days.length-1];
    var total = last.w - first.w;
    var totalPct = (first.w - last.w)/first.w*100;
    var h = '';
    h += '<div class="stat"><b>'+r1(last.w)+' kg</b><span>Latest ('+nice(last.date)+')</span></div>';
    h += '<div class="stat"><b class="'+cls(total)+'">'+sign(total,' kg')+'</b><span>Since start ('+r1(totalPct)+'% lost)</span></div>';
    var lw = wk[wk.length-1];
    if (lw && lw.pct != null){
      h += '<div class="stat"><b class="'+cls(-lw.pct)+'">'+r1(lw.pct)+'%</b><span>Last week change (lost)</span></div>';
    } else {
      h += '<div class="stat"><b>&ndash;</b><span>Last week change</span></div>';
    }
    el.innerHTML = h;
  }

  function renderWeeks(wk){
    var el = document.getElementById('weeks');
    if (!wk.length){ el.innerHTML = '<div class="empty">Weekly averages will appear here.</div>'; return; }
    var h = '<table><thead><tr><th>Week</th><th>Days</th><th>Avg kg</th><th>Change kg</th><th>% lost</th><th>Avg waist</th><th>Waist &Delta;</th></tr></thead><tbody>';
    wk.slice().reverse().forEach(function(x){
      h += '<tr><td>'+nice(x.start)+' &ndash; '+nice(x.end)+'</td><td>'+x.n+'</td><td>'+r1(x.w)+'</td>';
      if (x.dw != null){
        h += '<td class="'+cls(x.dw)+'">'+sign(x.dw)+'</td><td class="'+cls(-x.pct)+'">'+r1(x.pct)+'%</td>';
      } else {
        h += '<td class="muted">&ndash;</td><td class="muted">&ndash;</td>';
      }
      h += '<td>'+(x.c!=null?r1(x.c):'&ndash;')+'</td>';
      h += (x.dc!=null ? '<td class="'+cls(x.dc)+'">'+sign(x.dc)+'</td>' : '<td class="muted">&ndash;</td>');
      h += '</tr>';
    });
    el.innerHTML = h + '</tbody></table>';
  }

  function renderDays(days){
    var el = document.getElementById('days');
    if (!days.length){ el.innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
    var h = '<table><thead><tr><th>Date</th><th>Weight</th><th>Waist</th><th></th></tr></thead><tbody>';
    days.slice().reverse().forEach(function(d){
      h += '<tr data-d="'+d.date+'"><td><a href="#" class="edit" data-d="'+d.date+'" style="color:inherit">'+niceFull(d.date)+'</a></td><td>'+r1(d.w)+' kg</td><td>'+(d.c!=null?r1(d.c)+' cm':'&ndash;')+'</td>';
      h += '<td><button class="x" data-del="'+d.date+'" aria-label="Delete">&times;</button></td></tr>';
    });
    el.innerHTML = h + '</tbody></table>';
  }

  function renderChart(days, wk){
    var el = document.getElementById('chart');
    var key = mode;
    var pts = days.filter(function(d){ return d[key] != null; });
    if (pts.length < 2){ el.innerHTML = '<div class="empty">Add at least two entries to see the chart.</div>'; return; }
    var W=640,H=260,L=44,R=12,T=12,B=28;
    var t0 = parse(pts[0].date).getTime(), t1 = parse(pts[pts.length-1].date).getTime();
    if (t1===t0) t1 = t0+86400000;
    var vals = pts.map(function(p){return p[key];});
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad_ = Math.max((hi-lo)*0.15, 0.5); lo -= pad_; hi += pad_;
    function X(date){ return L + (parse(date).getTime()-t0)/(t1-t0)*(W-L-R); }
    function Y(v){ return T + (hi-v)/(hi-lo)*(H-T-B); }
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Chart">';
    for (var i=0;i<=4;i++){
      var v = lo + (hi-lo)*i/4, y = Y(v);
      s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>';
      s += '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+r1(v)+'</text>';
    }
    s += '<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+nice(pts[0].date)+'</text>';
    s += '<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+nice(pts[pts.length-1].date)+'</text>';
    // daily line
    s += '<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" opacity=".6" points="'+pts.map(function(p){return X(p.date)+','+Y(p[key]);}).join(' ')+'"/>';
    pts.forEach(function(p){ s += '<circle cx="'+X(p.date)+'" cy="'+Y(p[key])+'" r="2.5" fill="var(--muted)"/>'; });
    // weekly average line (plotted at mid-week, clamped to data range)
    var wp = wk.filter(function(x){ return x[key] != null; }).map(function(x){
      var mid = parse(x.start); mid.setDate(mid.getDate()+3);
      var tx = Math.min(Math.max(mid.getTime(), t0), t1);
      return {x: L + (tx-t0)/(t1-t0)*(W-L-R), y: Y(x[key])};
    });
    if (wp.length){
      s += '<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="'+wp.map(function(p){return p.x+','+p.y;}).join(' ')+'"/>';
      wp.forEach(function(p){ s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--accent)"/>'; });
    }
    s += '</svg><div class="sub" style="margin:6px 0 0">Gray = daily &middot; <span style="color:var(--accent)">Teal = weekly average</span></div>';
    el.innerHTML = s;
  }

  function render(){
    var days = sortedDays(), wk = weeks();
    renderStats(days, wk); renderChart(days, wk); renderWeeks(wk); renderDays(days);
  }

  // ---- events ----
  var $date = document.getElementById('date'), $w = document.getElementById('weight'), $c = document.getElementById('waist');
  $date.value = fmt(new Date());

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var w = parseFloat($w.value), c = $c.value === '' ? null : parseFloat($c.value);
    if (!$date.value || isNaN(w)) return;
    var prev = data.entries[$date.value];
    if (c == null && prev && prev.c != null && !confirm('This date already has a waist value. Keep it?')) { /* user chose to clear */ } else if (c == null && prev) { c = prev.c; }
    data.entries[$date.value] = { w: w, c: (c==null||isNaN(c)) ? null : c };
    save(); render();
    $w.value = ''; $c.value = '';
    $date.value = fmt(new Date());
  });

  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  });

  document.getElementById('days').addEventListener('click', function(e){
    var del = e.target.closest('[data-del]');
    if (del){
      if (confirm('Delete entry for '+niceFull(del.dataset.del)+'?')){ delete data.entries[del.dataset.del]; save(); render(); }
      return;
    }
    var ed = e.target.closest('.edit');
    if (ed){
      e.preventDefault();
      var en = data.entries[ed.dataset.d];
      $date.value = ed.dataset.d; $w.value = en.w; $c.value = en.c==null ? '' : en.c;
      window.scrollTo({top:0,behavior:'smooth'}); $w.focus();
    }
  });

  function download(name, text, type){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text],{type:type}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById('exportJson').onclick = function(){
    download('weight-log-'+fmt(new Date())+'.json', JSON.stringify(data,null,2), 'application/json');
  };
  document.getElementById('exportCsv').onclick = function(){
    var rows = ['date,weight_kg,waist_cm'];
    sortedDays().forEach(function(d){ rows.push(d.date+','+d.w+','+(d.c==null?'':d.c)); });
    download('weight-log-'+fmt(new Date())+'.csv', rows.join('\n'), 'text/csv');
  };
  var $file = document.getElementById('importFile');
  document.getElementById('importBtn').onclick = function(){ $file.click(); };
  $file.onchange = function(){
    var f = $file.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var inc = JSON.parse(rd.result);
        if (!inc || typeof inc.entries !== 'object') throw new Error('bad');
        var n = 0;
        Object.keys(inc.entries).forEach(function(k){
          var e = inc.entries[k];
          if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof e.w === 'number'){ data.entries[k] = {w:e.w, c:(typeof e.c==='number')?e.c:null}; n++; }
        });
        save(); render(); alert('Imported '+n+' entries (merged with existing data).');
      } catch(err){ alert('That file is not a valid backup.'); }
      $file.value = '';
    };
    rd.readAsText(f);
  };

  render();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
